<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Success 10 · Bài giảng trình chiếu — English Insiders</title>
  <meta name="description" content="Khung bài giảng số tương tác 10 Units và 80 Lessons môn Tiếng Anh 10 Global Success dành cho giáo viên trình chiếu trên lớp.">
  <link rel="icon" type="image/svg+xml" href="/assets/images/English_Insider_Logo.svg">

  <!-- Global Success 10 Custom Styling -->
  <link rel="stylesheet" href="css/gs10.css">
  
  <style>
    /* Mandatory permanent AI disclosure banner from AGENTS.md §6 */
    .ai-banner-strip {
      background: #fef2f2;
      border-bottom: 1px solid #fee2e2;
      color: #991b1b;
      padding: 10px 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 500;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 200;
    }
  </style>
</head>
<body class="gs10-container">

  <!-- MANDATORY AI DISCLOSURE BANNER (PERMANENT) -->
  <div class="ai-banner-strip">
    <span>🤖 All study materials are generated by AI and may contain inaccuracies. Please verify critical information independently.</span>
  </div>

  <!-- TOP HEADER -->
  <header class="gs10-header">
    <div class="gs10-header__brand" onclick="window.location.href='/Global_Success_10/'">
      <div class="gs10-header__logo-badge">GS 10</div>
      <div class="gs10-header__title-group">
        <h1>Global Success 10 · Interactive Courseware</h1>
        <p>Khu vực giáo viên · Bài giảng trình chiếu trên lớp</p>
      </div>
    </div>

    <div class="gs10-header__actions">
      <a href="/" class="gs10-btn gs10-btn--secondary">
        🏠 English Insiders Home
      </a>
      <a href="/me/" class="gs10-btn gs10-btn--secondary">
        👤 Dữ liệu
      </a>
    </div>
  </header>

  <!-- MAIN INTERACTIVE MOUNT ROOT -->
  <main id="gs10-app-root">
    <!-- Rendered dynamically by GS10 engine after passing gate -->
  </main>

  <!-- DECORATIVE LANDSCAPE FOOTER -->
  <div class="gs10-bg-landscape"></div>

  <!-- GATEKEEPER & APPLICATION SCRIPT -->
  <script type="module">
    import { openGate } from '/Global_Success_10/js/gs10-gate.js';
    
    // Check gatekeeper before loading unit data
    const allowed = await openGate();
    if (allowed) {
      const s = document.createElement('script');
      s.src = 'js/gs10-player.js';
      s.onload = () => {
        if (window.GS10) {
          window.GS10.init();
        }
      };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
